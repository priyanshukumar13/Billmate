name: BillMate CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-validation:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate backend JavaScript syntax
        run: |
          find . -path './node_modules' -prune -o -name '*.js' -print0 |
            xargs -0 -n1 node --check

      - name: Run backend integration test
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TEST_API_BASE: http://127.0.0.1:5000
          MOCK_EMAIL: "true"
        run: |
          if [ -z "$MONGO_URI" ]; then
            echo "::warning::Backend integration test skipped: MONGO_URI is not configured for this workflow run."
            exit 0
          fi

          node server.js > /tmp/billmate-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/health >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Backend server exited before becoming ready."
              cat /tmp/billmate-server.log
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:5000/health >/dev/null
          npm test

  frontend-validation:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
