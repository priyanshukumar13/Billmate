name: Docker publish

on:
  workflow_run:
    workflows:
      - "BillMate CI"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/priyanshukumar13/billmate-backend:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
            ghcr.io/priyanshukumar13/billmate-backend:latest
          cache-from: type=gha,scope=billmate-backend
          cache-to: type=gha,mode=max,scope=billmate-backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/priyanshukumar13/billmate-frontend:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
            ghcr.io/priyanshukumar13/billmate-frontend:latest
          cache-from: type=gha,scope=billmate-frontend
          cache-to: type=gha,mode=max,scope=billmate-frontend
