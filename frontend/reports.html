<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillMate - Reports</title>
    <link rel="stylesheet" href="dashboard-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="auth.js"></script>
    <script>
        if (!window.getBillmateToken()) {
            window.location.href = 'login.html';
        }
    </script>
    <script type="module" src="/src/reports-main.jsx"></script>
</head>
<body>

<div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <a href="dashboard.html" class="logo-area">
            <img src="icons/invoice.png" alt="Logo" class="logo-icon">
            <span>BillMate</span>
        </a>

        <nav class="side-nav">
            <a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a>
            <a href="calendar.html"><i data-lucide="calendar"></i> Calendar</a>
            <a href="bills.html"><i data-lucide="receipt"></i> Bills</a>
            <a href="expenses.html"><i data-lucide="pie-chart"></i> Expenses</a>
            <a href="reports.html" class="active"><i data-lucide="file-text"></i> Reports</a>
            <a href="budget.html"><i data-lucide="target"></i> Budget</a>
            <a href="assistant.html"><i data-lucide="sparkles"></i> AI Assistant</a>
            <a href="settings.html"><i data-lucide="settings"></i> Settings</a>
        </nav>

        <!-- Sidebar Upload Receipt Card -->
        <div class="sidebar-upload-card">
            <div class="icon-box">
                <i data-lucide="file-up"></i>
            </div>
            <h4>Upload Receipt</h4>
            <p>Scan & extract bill details</p>
            <button class="btn-upload-now" onclick="window.location.href='dashboard.html'">Upload Now</button>
        </div>

        <div class="sidebar-footer">
            <button class="btn-logout" id="logoutBtn"><i data-lucide="log-out"></i> Logout</button>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="main-content" style="padding: 2rem 2.5rem; background: var(--bg); overflow-y: auto;">
        <div id="react-reports-root"></div>
    </main>
</div>

<!-- React Floating AI Assistant mounts here -->
<div id="react-assistant-root"></div>

<script src="theme.js"></script>
<script type="module" src="/src/dashboard-react-main.jsx"></script>
<script>
    if (window.lucide) {
        lucide.createIcons();
    }
</script>
</body>
</html>
