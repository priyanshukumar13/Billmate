<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillMate - AI Assistant</title>

    <link rel="stylesheet" href="dashboard-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="auth.js"></script>
    <script>
        if (!window.getBillmateToken()) {
            window.location.href = 'login.html';
        }
    </script>
</head>
<body>

<div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <a href="dashboard.html" class="logo-area">
            <img src="icons/invoice.png" alt="Logo" class="logo-icon">
            <span>BillMate</span>
        </a>

        <nav class="side-nav">
            <a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a>
            <a href="calendar.html"><i data-lucide="calendar"></i> Calendar</a>
            <a href="bills.html"><i data-lucide="receipt"></i> Bills</a>
            <a href="expenses.html"><i data-lucide="pie-chart"></i> Expenses</a>
            <a href="reports.html"><i data-lucide="file-text"></i> Reports</a>
            <a href="budget.html"><i data-lucide="target"></i> Budget</a>
            <a href="assistant.html" class="active"><i data-lucide="sparkles"></i> AI Assistant</a>
            <a href="settings.html"><i data-lucide="settings"></i> Settings</a>
        </nav>

        <!-- Sidebar Upload Receipt Card -->
        <div class="sidebar-upload-card">
            <div class="icon-box">
                <i data-lucide="file-up"></i>
            </div>
            <h4>Upload Receipt</h4>
            <p>Scan & extract bill details</p>
            <button class="btn-upload-now" onclick="window.location.href='dashboard.html'">Upload Now</button>
        </div>

        <div class="sidebar-footer">
            <button class="btn-logout" id="logoutBtn"><i data-lucide="log-out"></i> Logout</button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- TOP HEADER -->
        <div class="top-header">
            <div class="header-left">
                <h1 class="header-greeting">AI Assistant</h1>
                <p class="header-subtitle">Your smart financial companion.</p>
            </div>
            
            <div class="header-actions">
                <a href="bills.html" class="btn-add-bill-header">
                    <i data-lucide="plus"></i> Add New Bill
                </a>
                <div class="notification-bell" title="Notifications">
                    <i data-lucide="bell"></i>
                    <span class="notification-dot"></span>
                </div>
                <a href="settings.html" class="header-profile-wrap">
                    <img id="headerUserAvatar" src="icons/user-avatar.png" alt="Avatar" />
                    <div class="header-profile-text">
                        <span class="header-profile-name" id="topUserName">User</span>
                        <span class="header-profile-link">View Profile</span>
                    </div>
                    <i data-lucide="chevron-down" style="color: #64748b; width: 14px; height: 14px;"></i>
                </a>
            </div>
        </div>

        <!-- CHAT CONTAINER -->
        <div class="chat-page-container">
            <!-- Messages Stream -->
            <div class="chat-page-messages" id="chatPageMessages">
                <!-- AI Welcome Message -->
                <div class="chat-msg-row">
                    <div class="chat-msg-avatar ai">
                        <i data-lucide="bot"></i>
                    </div>
                    <div class="chat-bubble ai">
                        <p id="aiGreetingMessage">Hello! 👋 How can I help you with your bills and finances today?</p>
                    </div>
                </div>
            </div>

            <!-- Suggestion Chips Bar -->
            <div class="suggestion-chips-bar">
                <button class="suggestion-chip" data-prompt="How much did I spend this month?">How much did I spend this month?</button>
                <button class="suggestion-chip" data-prompt="Which bill is due next?">Which bill is due next?</button>
                <button class="suggestion-chip" data-prompt="How much budget is remaining?">How much budget is remaining?</button>
                <button class="suggestion-chip" data-prompt="Show my upcoming bills">Show my upcoming bills</button>
                <button class="suggestion-chip" data-prompt="Spending by category">Spending by category</button>
                <button class="suggestion-chip" data-prompt="Budget summary">Budget summary</button>
            </div>

            <!-- Input Bar -->
            <form id="chatPageForm" class="chat-input-bar">
                <input type="text" id="chatPageInput" placeholder="Type your message..." autocomplete="off" required>
                <button type="submit" class="btn-primary" id="chatSendBtn">
                    <i data-lucide="send"></i>
                </button>
            </form>
        </div>
    </main>
</div>

<script src="theme.js"></script>
<script src="assistant-page.js"></script>
<script>
    if (window.lucide) {
        lucide.createIcons();
    }
</script>
</body>
</html>
