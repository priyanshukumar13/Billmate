server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Health check endpoint for Docker container monitoring
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Hashed static assets (Vite assets with immutable cache)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Media, images, and fonts
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Multi-page application routing:
    # 1. Exact file match ($uri) e.g., /auth.js, /dashboard-style.css
    # 2. Clean URL without extension -> file.html ($uri.html) e.g., /dashboard -> /dashboard.html
    # 3. Directory match ($uri/)
    # 4. Fallback to index.html for root path
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Disable caching for HTML and dynamic JSON configs so updates appear immediately
    location ~* \.(?:html|json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
