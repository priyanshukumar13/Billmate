<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillMate - Settings</title>
    <link rel="stylesheet" href="settings.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <img src="icons/invoice.png" alt="Logo" class="logo-icon">
                <span>BillMate</span>
            </div>
            <nav class="side-nav">
                <a href="dashboard.html">📊 Dashboard</a>
                <a href="calendar.html">📅 Calendar</a>
                <a href="expenses.html">📈 Expenses</a>
                <a href="reports.html">📊 Reports</a>
                <a href="settings.html" class="active">⚙️ Settings</a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="btn-logout">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <h2>Settings</h2>
                <div class="user-pill"><span id="userName">User</span></div>
            </header>

            <div class="settings-container">
                <!-- Profile Card -->
                <section class="card">
                    <h3>👤 Profile Information</h3>
                    <div class="form-group-avatar">
                        <div class="avatar-wrapper">
                            <img id="userAvatar" src="icons/user-avatar.png" alt="Avatar Preview" class="settings-avatar">
                            <label for="avatarInput" class="avatar-overlay">Change</label>
                            <input type="file" id="avatarInput" accept="image/*" style="display:none;">
                        </div>
                        <div class="avatar-info">
                            <h4>Profile Picture</h4>
                            <p>Upload a new profile picture. JPG or PNG.</p>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="profileUsername">Username</label>
                            <input type="text" id="profileUsername" placeholder="e.g. JohnDoe">
                        </div>
                        <div class="form-group">
                            <label for="profileEmail">Email Address</label>
                            <input type="email" id="profileEmail" placeholder="e.g. johndoe@example.com" disabled>
                        </div>
                    </div>
                </section>

                <!-- Preferences Card -->
                <section class="card">
                    <h3>⚙️ Preferences</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="budgetLimitInput">Monthly Budget Limit (₹)</label>
                            <input type="number" id="budgetLimitInput" placeholder="e.g. 20000">
                        </div>
                        <div class="form-group">
                            <label for="alertThresholdInput">Due Date Alert Threshold</label>
                            <select id="alertThresholdInput">
                                <option value="1">1 Day Before</option>
                                <option value="3">3 Days Before</option>
                                <option value="7">7 Days Before</option>
                            </select>
                        </div>
                    </div>
                </section>

                <!-- Danger Zone -->
                <section class="card danger-zone">
                    <h3>⚠️ Danger Zone</h3>
                    <p>Once you delete your data, it cannot be undone.</p>
                    <button id="resetDataBtn" class="btn-danger">Reset All App Data</button>
                </section>

                <div class="action-bar">
                    <button id="saveSettingsBtn" class="btn-primary">Save Changes</button>
                </div>
            </div>
        </main>
    </div>

    <!-- React Floating AI Assistant mounts here -->
    <div id="react-assistant-root"></div>

    <script src="theme.js"></script>
    <script src="settings.js"></script>
    <script type="module" src="assets/dashboard_react.js"></script>

</body>
</html>
