<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillMate Reports</title>
    <!-- Simple auth check to prevent flash of content -->
    <script>
        const token = localStorage.getItem('billmateToken');
        if (!token) {
            window.location.href = 'login.html';
        }
    </script>
    <link rel="stylesheet" href="../dashboard-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo-area">📑 BillMate</div>

        <nav class="side-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="calendar.html">Calendar</a>
            <a href="expenses.html">Expenses</a>
            <a href="reports.html" class="active">Reports</a>
            <a href="settings.html">Settings</a>
        </nav>

        <button class="btn-logout" id="logoutBtn">Logout</button>
    </aside>

    <!-- MAIN -->
    <main class="main-content" style="padding: 0; background: #070707;">
        <div id="react-reports-root"></div>
    </main>
</div>

<script src="../theme.js"></script>
<script>
    document.getElementById('logoutBtn').onclick = () => {
        localStorage.removeItem('billmateToken');
        localStorage.removeItem('billmateUser');
        localStorage.removeItem('billmateEmail');
        localStorage.removeItem('billmateProfilePicture');
        window.location.href = 'login.html';
    };
</script>
<script type="module" src="/src/reports-main.jsx"></script>

</body>
</html>
