server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Health check endpoint (Kubernetes readiness/liveness probe)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # ============================================================
    # API Reverse Proxy to Kubernetes backend ClusterIP Service
    # Browsers cannot resolve "billmate-backend" directly — Nginx
    # handles the hop from browser → frontend pod → backend service.
    # This prevents localhost:5000 or inaccessible K8s DNS from ever
    # appearing in browser network calls.
    # ============================================================
    location ^~ /api/ {
        proxy_pass         http://billmate-backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        # Remove CORS headers from backend; Nginx handles origin
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Access-Control-Allow-Credentials;
        add_header         Access-Control-Allow-Origin  "$http_origin" always;
        add_header         Access-Control-Allow-Credentials "true" always;
        add_header         Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept" always;
        # Handle CORS preflight (OPTIONS) entirely at Nginx
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  "$http_origin" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
    }

    # Hashed static assets (Vite assets with immutable cache)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Media, images, and fonts
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Multi-page application routing:
    # 1. Exact file match ($uri)
    # 2. Clean URL without extension -> file.html
    # 3. Directory match ($uri/)
    # 4. Fallback to index.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Disable caching for HTML so deploys appear immediately
    location ~* \.(?:html|json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
