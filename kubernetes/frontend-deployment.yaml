apiVersion: apps/v1
kind: Deployment
metadata:
  name: billmate-frontend
  namespace: billmate
  labels:
    app: billmate
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billmate
      component: frontend
  template:
    metadata:
      labels:
        app: billmate
        component: frontend
    spec:
      containers:
        - name: frontend
          image: billremainder-frontend-k8s:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
