apiVersion: v1
kind: Service
metadata:
  name: billmate-frontend
  namespace: billmate
  labels:
    app: billmate
    component: frontend
spec:
  # NodePort: exposes the frontend to the Windows host via Minikube IP
  type: NodePort
  selector:
    app: billmate
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
