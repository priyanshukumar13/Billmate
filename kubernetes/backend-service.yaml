apiVersion: v1
kind: Service
metadata:
  name: billmate-backend
  namespace: billmate
  labels:
    app: billmate
    component: backend
spec:
  # ClusterIP: only reachable inside the cluster (Nginx in the frontend pod uses this)
  type: ClusterIP
  selector:
    app: billmate
    component: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
